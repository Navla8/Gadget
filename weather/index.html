<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/weather.css">
</head>
<body>
<script type="module">
  import { createWeather } from '../shared/weather.js';
  import { fit, autoFit } from '../shared/fit.js';

  const wx = createWeather(() => layout());
  document.body.append(wx);

  // 세로로 긴 임베드면 위아래로 쌓고, 전체를 임베드에 꽉 채움
  function layout() {
    wx.classList.toggle('column', innerWidth / innerHeight < 1.3);
    fit(wx);
  }
  autoFit(layout);
</script>
</body>
</html>
