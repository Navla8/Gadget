<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gadget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
  :root {
    --bg: #ffffff; --text: rgb(55, 53, 47); --muted: rgba(55, 53, 47, 0.55);
    --line: rgba(55, 53, 47, 0.14); --soft: rgba(55, 53, 47, 0.04); --accent: #c8553d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --text: rgba(255, 255, 255, 0.86); --muted: rgba(255, 255, 255, 0.48); --line: rgba(255, 255, 255, 0.14); --soft: rgba(255, 255, 255, 0.04); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "EB Garamond", "Noto Serif KR", Georgia, serif; font-size: 17px; line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-weight: 500; font-size: 2rem; margin: 0 0 4px; }
  h2 { font-weight: 500; font-size: 1.3rem; margin: 0; }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  section { border-top: 1px solid var(--line); padding: 28px 0; }
  .global { display: flex; flex-wrap: wrap; gap: 10px 24px; padding: 16px 0 28px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 14px 0; font-size: 0.92rem; color: var(--muted); }
  label { display: flex; gap: 6px; align-items: center; }
  input, select {
    font: inherit; color: var(--text); background: transparent;
    border: 0; border-bottom: 1px solid var(--line); padding: 0 2px; width: 6em;
  }
  select { width: auto; }
  input[type="checkbox"] { width: auto; accent-color: var(--accent); margin: 0; }
  input[type="range"] { width: 7em; accent-color: var(--accent); border: 0; }
  input[type="color"] { width: 2.4em; height: 1.4em; padding: 0; border: 0; cursor: pointer; }
  input.size { width: 3.6em; }
  .frame { border: 1px dashed var(--line); border-radius: 4px; overflow: hidden; resize: both; max-width: 100%; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .url { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .url code {
    flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 0.85rem;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
  }
  button { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }

  /* 시계 배치판 */
  .board {
    display: grid; grid-template-columns: 1fr 1.3fr 1fr; grid-template-rows: auto auto auto;
    gap: 6px; max-width: 460px; margin: 8px 0 16px; font-size: 0.9rem;
  }
  .zone {
    border: 1px dashed var(--line); border-radius: 6px; padding: 6px; min-height: 44px;
    display: flex; flex-direction: column; gap: 5px; justify-content: center;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .zone:empty::after { content: attr(data-label); color: var(--muted); font-size: 0.8rem; text-align: center; }
  .zone.over { border-color: var(--accent); background: var(--soft); }
  /* 왼쪽·오른쪽 칸은 위~아래 전체 높이 */
  .z-top { grid-area: 1 / 2; } .z-left { grid-area: 1 / 1 / 4 / 2; } .z-center { grid-area: 2 / 2; min-height: 96px; border-style: solid; }
  .z-right { grid-area: 1 / 3 / 4 / 4; } .z-bottom { grid-area: 3 / 2; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; text-align: center;
    background: var(--bg); cursor: grab; user-select: none; touch-action: none;
  }
  .chip.off { opacity: 0.35; text-decoration: line-through; }
  .chip.picked { border-color: var(--accent); color: var(--accent); }
  .chip:active { cursor: grabbing; }
  .hint { font-size: 0.8rem; color: var(--muted); margin: -8px 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Gadget</h1>
  <p class="lead">노션 <code>/embed</code> 블록에 아래 주소를 붙여 넣으세요. 배경은 투명하고, 내용은 임베드 크기에 맞춰 꽉 차게 그려집니다.</p>
  <div class="global opts">
    <label>포인트 색 <input type="color" id="accent"></label>
    <label>테마 <select id="theme"><option value="auto">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select></label>
    <button id="resetAll" style="font-size:0.85rem">설정 초기화</button>
  </div>
  <div id="list"></div>
</main>
<script type="module">
  // ── 저장된 설정 ─────────────────────────────────────
  const STORE = 'gadget:settings';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE)) ?? {}; } catch {}
  const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch {} };

  // ── 공통 설정: 맨 위에서 한 번만 정하고 모든 주소에 붙임 ──
  const DEFAULT_ACCENT = '#c8553d';
  const g = Object.fromEntries(['accent', 'theme'].map((id) => [id, document.getElementById(id)]));
  g.accent.value = saved.accent ?? DEFAULT_ACCENT;
  g.theme.value = saved.theme ?? 'auto';
  document.getElementById('resetAll').onclick = () => { saved = {}; persist(); location.reload(); };

  function globalQuery(q) {
    const a = g.accent.value.replace('#', '');
    if (a !== DEFAULT_ACCENT.slice(1)) q.set('accent', a);
    if (g.theme.value !== 'auto') q.set('theme', g.theme.value);
  }

  // ── 모듈 정의 ───────────────────────────────────────
  // type: check(0/1) | select | text | number | range
  const modules = [
    { key: 'clock', path: 'clock/', title: '시계 · 날짜 · 날씨', size: [520, 170], board: true, opts: [
      { key: 'asize', label: '아날로그', type: 'range', min: 0.3, max: 2.5, step: 0.05, def: '1', group: 'size' },
      { key: 'dsize', label: '디지털', type: 'range', min: 0.3, max: 2.5, step: 0.05, def: '1', group: 'size' },
      { key: 'datesize', label: '날짜', type: 'range', min: 0.3, max: 2.5, step: 0.05, def: '1', group: 'size' },
      { key: 'wsize', label: '날씨', type: 'range', min: 0.3, max: 2.5, step: 0.05, def: '1', group: 'size' },
      { key: 'gap', label: '간격', type: 'range', min: 0, max: 1, step: 0.05, def: '0.15', group: 'size' },
      { key: 'hand', label: '초침', type: 'check', def: '1' },
      { key: 'seconds', label: '디지털 초', type: 'check', def: '0' },
      { key: 'hour12', label: '12시간제', type: 'check', def: '0' },
      { key: 'blink', label: '콜론 깜박임', type: 'check', def: '1' },
      { key: 'lang', label: '언어', type: 'select', options: [['ko', '한국어'], ['en', 'English']], def: 'ko' },
      { key: 'city', label: '도시', type: 'text', def: '', placeholder: '예: 서울', group: 'weather' },
      { key: 'name', label: '표시 이름', type: 'text', def: '', placeholder: '(선택)', group: 'weather' },
      { key: 'tomorrow', label: '내일 날씨', type: 'check', def: '1', group: 'weather' },
      { key: 'wdir', label: '방향', type: 'select', options: [['auto', '자동'], ['row', '가로'], ['column', '세로']], def: 'auto', group: 'weather' },
    ] },
    { key: 'pomodoro', path: 'pomodoro/', title: '포모도로', size: [300, 280], opts: [
      { key: 'min', label: '기본 분', type: 'number', def: '90' },
      { key: 'layout', label: '형태', type: 'select', options: [['auto', '자동'], ['ring', '원형'], ['bar', '막대']], def: 'auto' },
      { key: 'tsize', label: '막대 크기', type: 'range', min: 0.3, max: 1, step: 0.05, def: '1' },
      { key: 'vol', label: '음량', type: 'range', min: 0, max: 1, step: 0.05, def: '0.6' },
      { key: 'id', label: 'id', type: 'text', def: 'default' },
    ] },
  ];

  function control(o, value) {
    if (o.type === 'check') return `<label><input type="checkbox" data-k="${o.key}" ${value === '1' ? 'checked' : ''}> ${o.label}</label>`;
    if (o.type === 'select') return `<label>${o.label} <select data-k="${o.key}">${o.options.map(([v, t]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
    if (o.type === 'range') return `<label>${o.label} <input type="range" data-k="${o.key}" min="${o.min}" max="${o.max}" step="${o.step}" value="${value}"></label>`;
    return `<label>${o.label} <input type="${o.type}" data-k="${o.key}" value="${value}" placeholder="${o.placeholder ?? ''}"></label>`;
  }
  const readControl = (input) => (input.type === 'checkbox' ? (input.checked ? '1' : '0') : input.value.trim());

  // ── 시계 배치판 (드래그 앤 드롭) ─────────────────────
  // 다섯 칸 어디에든 요소를 놓을 수 있고, 한 칸에 여러 개면 위아래로 쌓임
  const SLOTS = [['top', '위'], ['left', '왼쪽'], ['center', '가운데'], ['right', '오른쪽'], ['bottom', '아래']];
  const ITEMS = [['analog', '아날로그'], ['digital', '디지털'], ['date', '날짜'], ['weather', '날씨']];
  const itemLabel = Object.fromEntries(ITEMS);
  const BOARD_DEF = () => ({
    slots: { top: [], left: ['analog'], center: ['digital', 'date'], right: ['weather'], bottom: [] },
    on: { analog: true, digital: true, date: true, weather: false },
  });

  function boardHtml() {
    return `
      <div class="opts">${ITEMS.map(([k, t]) => `<label><input type="checkbox" data-on="${k}"> ${t}</label>`).join('')}</div>
      <div class="board">${SLOTS.map(([z, t]) => `<div class="zone z-${z}" data-zone="${z}" data-label="${t}"></div>`).join('')}</div>
      <p class="hint">요소를 원하는 칸으로 끌어다 놓으세요. 한 칸에 여러 개를 놓으면 위아래로 쌓이고, 아날로그와 디지털·날짜를 같은 칸에 두면 글자가 시계 안쪽에 들어갑니다. 끌기가 불편하면 요소를 누른 뒤 옮길 칸을 누르세요.</p>`;
  }

  function setupBoard(sec, b, onChange) {
    let picked = null;
    const draw = () => {
      sec.querySelectorAll('[data-on]').forEach((c) => { c.checked = b.on[c.dataset.on]; });
      sec.querySelectorAll('.zone').forEach((z) => {
        z.innerHTML = b.slots[z.dataset.zone].map((it) =>
          `<div class="chip${b.on[it] ? '' : ' off'}${picked === it ? ' picked' : ''}" draggable="true" data-chip="${it}">${itemLabel[it]}</div>`).join('');
      });
    };
    // 요소를 zone의 before 앞(없으면 맨 뒤)으로 옮김
    const move = (it, zone, before) => {
      for (const list of Object.values(b.slots)) { const i = list.indexOf(it); if (i >= 0) list.splice(i, 1); }
      const list = b.slots[zone];
      const at = before && before !== it ? list.indexOf(before) : -1;
      list.splice(at >= 0 ? at : list.length, 0, it);
      picked = null;
      draw();
      onChange();
    };

    sec.querySelectorAll('[data-on]').forEach((c) => c.addEventListener('change', () => {
      b.on[c.dataset.on] = c.checked; draw(); onChange();
    }));

    let dragging = null;
    sec.addEventListener('dragstart', (e) => {
      dragging = e.target.dataset?.chip ?? null;
      e.dataTransfer?.setData('text/plain', dragging ?? '');
    });
    sec.addEventListener('dragend', () => { dragging = null; sec.querySelectorAll('.over').forEach((n) => n.classList.remove('over')); });
    sec.querySelectorAll('.zone').forEach((z) => {
      z.addEventListener('dragover', (e) => { if (dragging) { e.preventDefault(); z.classList.add('over'); } });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', (e) => {
        e.preventDefault();
        z.classList.remove('over');
        if (dragging) move(dragging, z.dataset.zone, e.target.closest('[data-chip]')?.dataset.chip);
      });
      // 클릭: 요소를 고른 뒤 칸(또는 그 칸의 요소 앞)을 누르면 이동
      z.addEventListener('click', (e) => {
        const c = e.target.closest('[data-chip]')?.dataset.chip;
        if (picked && picked !== c) move(picked, z.dataset.zone, c);
        else { picked = picked === c ? null : c ?? null; draw(); }
      });
    });
    draw();
  }

  // ── 화면 만들기 ─────────────────────────────────────
  const base = new URL('.', location.href);
  const list = document.getElementById('list');
  const updaters = [];

  for (const m of modules) {
    const s = (saved[m.key] ??= {});
    if (m.key === 'clock' && saved.city && s.city === undefined) { s.city = saved.city; s.name = saved.cityName; }
    const value = (o) => s[o.key] ?? o.def;
    const [w, h] = s.size ?? m.size;
    const GROUP_TITLE = { size: '크기', weather: '날씨' };
    const groups = ['size', undefined, 'weather'].map((gk) => m.opts.filter((o) => o.group === gk)).filter((x) => x.length);
    const sec = document.createElement('section');
    sec.innerHTML = `
      <div class="head"><h2>${m.title}</h2>
        <span class="opts" style="margin:0">미리보기
          <input class="size" type="number" data-w value="${w}">×<input class="size" type="number" data-h value="${h}">px</span></div>
      ${m.board ? boardHtml() : ''}
      ${groups.map((gr) => `<div class="opts" data-group="${gr[0].group ?? ''}">${gr[0].group ? `<span>${GROUP_TITLE[gr[0].group]}</span>` : ''}${gr.map((o) => control(o, value(o))).join('')}</div>`).join('')}
      <div class="frame" style="width:${w}px;height:${h}px"><iframe loading="lazy"></iframe></div>
      <div class="url"><code></code><button>복사</button></div>`;
    list.append(sec);

    const frame = sec.querySelector('.frame');
    const iframe = sec.querySelector('iframe');
    const code = sec.querySelector('code');
    // 이전 형식(pos 등)으로 저장된 배치는 새 기본값으로
    if (m.board && !s.board?.slots) s.board = BOARD_DEF();
    const board = m.board ? s.board : null;

    const update = () => {
      const q = new URLSearchParams();
      if (board) for (const [z] of SLOTS) {
        const items = board.slots[z].filter((it) => board.on[it]);
        if (items.length) q.set(z, items.join(','));
      }
      const weatherOn = !board || board.on.weather;
      const wRow = sec.querySelector('[data-group="weather"]');
      if (wRow) wRow.style.opacity = weatherOn ? 1 : 0.4;
      for (const o of m.opts) {
        const v = readControl(sec.querySelector(`[data-k="${o.key}"]`));
        s[o.key] = v;
        if (o.group === 'weather' && !weatherOn) continue;
        if (v !== '' && v !== o.def) q.set(o.key, v);
      }
      globalQuery(q);
      persist();
      const url = new URL(m.path, base);
      url.search = q.toString().replaceAll('%2C', ',');
      code.textContent = url.href;
      if (iframe.src !== url.href) iframe.src = url.href;
    };
    updaters.push(update);
    if (board) setupBoard(sec, board, update);
    sec.querySelectorAll('[data-k]').forEach((i) => i.addEventListener(i.type === 'range' ? 'input' : 'change', update));

    // 미리보기 크기: 숫자 입력 또는 오른쪽 아래 모서리 끌기
    const sizeInputs = [sec.querySelector('[data-w]'), sec.querySelector('[data-h]')];
    sizeInputs.forEach((i) => i.addEventListener('input', () => {
      frame.style.width = `${sizeInputs[0].value}px`;
      frame.style.height = `${sizeInputs[1].value}px`;
      s.size = sizeInputs.map((x) => Number(x.value)); persist();
    }));
    new ResizeObserver(() => {
      sizeInputs[0].value = Math.round(frame.offsetWidth);
      sizeInputs[1].value = Math.round(frame.offsetHeight);
      s.size = sizeInputs.map((x) => Number(x.value)); persist();
    }).observe(frame);

    sec.querySelector('.url button').addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(code.textContent); e.target.textContent = '복사됨'; }
      catch { e.target.textContent = '직접 복사해 주세요'; }
      setTimeout(() => { e.target.textContent = '복사'; }, 1500);
    });
    update();
  }

  const updateGlobal = () => {
    Object.assign(saved, { accent: g.accent.value, theme: g.theme.value });
    document.documentElement.style.setProperty('--accent', g.accent.value);
    updaters.forEach((u) => u());
  };
  Object.values(g).forEach((i) => i.addEventListener('change', updateGlobal));
  document.documentElement.style.setProperty('--accent', g.accent.value);
</script>
</body>
</html>
