<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Today</title>
<style>html, body { background: transparent; }</style>
<!-- 날짜는 시계 모듈에 통합됨: 이전 임베드 주소를 날짜만 보이는 시계로 연결 -->
<script>
  const q = new URLSearchParams(location.search);
  q.set('analog', '0');
  q.set('digital', '0');
  q.set('date', '1');
  location.replace(`../clock/?${q}`);
</script>
</head>
<body></body>
</html>
