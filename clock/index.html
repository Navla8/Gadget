<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/weather.css">
<style>
  /* 왼쪽 | (위 / 가운데 / 아래) | 오른쪽 — 왼쪽·오른쪽 칸은 전체 높이를 차지 */
  #app { display: inline-flex; align-items: center; line-height: 1; white-space: nowrap; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 0.1em; }
  /* 디지털과 날짜가 붙어 있으면 더 가깝게 */
  .item.digital + .item.date, .item.date + .item.digital { margin-top: -0.06em; }

  .digital-face { font-family: var(--font-display); display: flex; align-items: baseline; letter-spacing: 0.01em; line-height: 0.8; }
  .colon { color: var(--accent); margin: 0 0.04em; transform: translateY(-0.06em); }
  /* 1초 켜짐 · 1초 흐림 */
  .blink .colon { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  .digital-face .small { font-size: 0.32em; color: var(--muted); margin-left: 0.2em; }
  .digital-face .ampm { margin: 0 0.25em 0 0; }

  /* 디지털과 같은 칸이면 한 줄, 아니면 연도까지 두 줄 */
  .date-face { font-size: 0.22em; color: var(--muted); letter-spacing: 0.03em; }
  .date-face .md { color: var(--text); }
  .date-face.solo { font-size: 0.5em; color: var(--text); text-align: center; letter-spacing: 0; }
  .date-face.solo .sub { display: block; font-size: 0.34em; color: var(--muted); margin-top: 0.3em; letter-spacing: 0.04em; }
  .date-face:not(.solo) .year { display: none; }

  .analog-face { position: relative; width: 1.6em; height: 1.6em; }
  /* 아날로그와 같은 칸의 디지털·날짜는 시계 안쪽 아래에 */
  .analog-face .inner { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0.1em; }
  .analog-face svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; }
  .tick.major { stroke: var(--text); stroke-width: 2; }
  .hand { stroke: var(--text); stroke-linecap: round; }
  .hand.second { stroke: var(--accent); stroke-width: 1.2; }
  .pin { fill: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { param, numParam, onVisible, pad } from '../shared/common.js';
  import { fit, autoFit } from '../shared/fit.js';

  // ── 옵션 ─────────────────────────────────────────────
  // 배치: top / left / center / right / bottom = 쉼표로 나열한 요소 (한 칸에 여러 개면 위아래로 쌓임)
  //       요소: analog, digital, date, weather      예) ?left=analog&center=digital,date
  // 크기: asize, dsize, datesize, wsize (기본 1)   간격: gap=0.15 (em)
  // 기타: hand=0 (초침 숨김), seconds=1, hour12=1, blink=0, lang=en, tz=Asia/Seoul
  //       날씨는 city / name / tomorrow (날씨 위젯과 같음), wdir=auto|row|column (방향)
  const SLOTS = ['top', 'left', 'center', 'right', 'bottom'];
  const ITEMS = ['analog', 'digital', 'date', 'weather'];
  const on = (k, d) => param(k, d) === '1';

  function readSlots() {
    const slots = Object.fromEntries(SLOTS.map((s) => [s, []]));
    const used = new Set();
    let any = false;
    for (const s of SLOTS) {
      for (const it of param(s, '').split(',').map((x) => x.trim())) {
        if (ITEMS.includes(it) && !used.has(it)) { slots[s].push(it); used.add(it); any = true; }
      }
    }
    if (any) return slots;
    // 이전 주소 호환: analog/digital/date + pos(+datefirst)
    const legacy = param('style', '');
    const showAnalog = on('analog', legacy === 'analog' ? '1' : '0');
    const text = [on('digital', legacy === 'analog' ? '0' : '1') && 'digital', on('date', '0') && 'date'].filter(Boolean);
    if (on('datefirst', '0')) text.reverse();
    slots.center = text;
    if (showAnalog) {
      const pos = param('pos', 'left');
      if (text.length === 0 || pos === 'inside') slots.center.unshift('analog');
      else slots[SLOTS.includes(pos) && pos !== 'center' ? pos : 'left'].push('analog');
    }
    return slots;
  }

  const slots = readSlots();
  const where = (it) => SLOTS.find((s) => slots[s].includes(it));
  const size = (k) => Math.min(4, Math.max(0.2, numParam(k, 1)));
  const gap = numParam('gap', 0.15);
  const showHand = on('hand', '1');
  const showSeconds = on('seconds', '0');
  const hour12 = on('hour12', '0');
  const blink = on('blink', '1');
  const lang = param('lang', 'ko');
  const tz = param('tz', undefined);

  // ── 시간 ─────────────────────────────────────────────
  const partsFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  function now() {
    const p = Object.fromEntries(partsFmt.formatToParts(new Date()).map((x) => [x.type, x.value]));
    return { h: Number(p.hour), m: Number(p.minute), s: Number(p.second) };
  }
  const locale = lang === 'en' ? 'en-US' : 'ko-KR';
  const dfmt = (o) => new Intl.DateTimeFormat(locale, { timeZone: tz, ...o });
  const mdFmt = dfmt({ month: 'long', day: 'numeric' });
  const yFmt = dfmt({ year: 'numeric' });
  const wdFmt = dfmt({ weekday: 'long' });

  // ── 요소 만들기 ───────────────────────────────────────
  const app = document.getElementById('app');
  const el = (tag, cls, html = '') => Object.assign(document.createElement(tag), { className: cls, innerHTML: html });
  const faces = {};

  function makeItem(kind) {
    const item = el('div', `item ${kind}`);
    const k = { analog: 'asize', digital: 'dsize', date: 'datesize', weather: 'wsize' }[kind];
    // 날씨는 기본 크기가 0.5em이라 배율을 곱해서 적용
    item.style.fontSize = `${(kind === 'weather' ? 0.5 : 1) * size(k)}em`;

    if (kind === 'digital') {
      faces.digital = el('div', `digital-face${blink ? ' blink' : ''}`,
        `<span class="small ampm" ${hour12 ? '' : 'hidden'}></span><span class="hh"></span><span class="colon">:</span><span class="mm"></span><span class="small ss" ${showSeconds ? '' : 'hidden'}></span>`);
      // 깜박임을 실제 초(짝수 초 켜짐)에 맞춤
      faces.digital.querySelector('.colon').style.animationDelay = `-${Date.now() % 2000}ms`;
      item.append(faces.digital);
    } else if (kind === 'date') {
      const solo = where('digital') !== where('date');
      faces.date = el('div', `date-face${solo ? ' solo' : ''}`,
        `<span class="md"></span> <span class="sub"><span class="year"></span><span class="year"> · </span><span class="wd accent"></span></span>`);
      item.append(faces.date);
    } else if (kind === 'analog') {
      const ticks = Array.from({ length: 12 }, (_, i) => {
        const major = i % 3 === 0;
        return `<line class="tick${major ? ' major' : ''}" x1="100" y1="${major ? 8 : 10}" x2="100" y2="${major ? 20 : 16}" transform="rotate(${i * 30} 100 100)"/>`;
      }).join('');
      faces.analog = el('div', 'analog-face', `
        <svg viewBox="0 0 200 200" aria-label="analog clock">
          ${ticks}
          <line data-h class="hand" x1="100" y1="112" x2="100" y2="52" stroke-width="4"/>
          <line data-m class="hand" x1="100" y1="114" x2="100" y2="28" stroke-width="2.4"/>
          ${showHand ? '<line data-s class="hand second" x1="100" y1="120" x2="100" y2="22"/>' : ''}
          <circle class="pin" cx="100" cy="100" r="3"/>
        </svg>`);
      item.append(faces.analog);
    } else if (kind === 'weather') {
      // 방향: 자동이면 왼쪽·오른쪽 칸을 혼자 차지할 때 세로, 그 외엔 가로
      const wdir = param('wdir', 'auto');
      const s = where('weather');
      const column = wdir === 'column' || (wdir === 'auto' && (s === 'left' || s === 'right') && slots[s].length === 1);
      import('../shared/weather.js').then(({ createWeather }) => {
        const wx = createWeather(() => layout());
        wx.classList.toggle('column', column);
        item.append(wx);
        layout();
      });
    }
    return item;
  }

  // 아날로그와 디지털·날짜가 같은 칸이면 글자를 시계 안에 넣음 (날씨는 그대로 쌓임)
  let inner = null;
  const slotEl = (name) => {
    const list = slots[name];
    if (!list.length) return null;
    const box = el('div', `slot ${name}`);
    const insideKinds = list.includes('analog') ? list.filter((it) => it === 'digital' || it === 'date') : [];
    for (const it of list) {
      if (insideKinds.includes(it)) continue;
      const item = makeItem(it);
      if (it === 'analog' && insideKinds.length) {
        inner = el('div', 'inner');
        inner.append(...insideKinds.map(makeItem));
        faces.analog.append(inner);
      }
      box.append(item);
    }
    return box;
  };
  const col = el('div', 'col');
  col.append(...['top', 'center', 'bottom'].map(slotEl).filter(Boolean));
  app.append(...[slotEl('left'), col.children.length ? col : null, slotEl('right')].filter(Boolean));
  app.style.gap = col.style.gap = `${gap}em`;

  // ── 그리기 ───────────────────────────────────────────
  const set = (node, text) => { if (node && node.textContent !== text) node.textContent = text; };
  let lastDay = '';

  function render() {
    const { h, m, s } = now();
    const d = faces.digital;
    if (d) {
      set(d.querySelector('.ampm'), h < 12 ? (lang === 'en' ? 'AM' : '오전') : (lang === 'en' ? 'PM' : '오후'));
      set(d.querySelector('.hh'), hour12 ? String(h % 12 || 12) : pad(h));
      set(d.querySelector('.mm'), pad(m));
      set(d.querySelector('.ss'), pad(s));
    }
    if (faces.analog) {
      const rot = (sel, deg) => faces.analog.querySelector(sel)?.setAttribute('transform', `rotate(${deg} 100 100)`);
      rot('[data-h]', (h % 12) * 30 + m * 0.5);
      rot('[data-m]', m * 6 + s * 0.1);
      rot('[data-s]', s * 6);
    }
    if (faces.date) {
      const day = new Date();
      const key = mdFmt.format(day) + yFmt.format(day);
      if (key !== lastDay) {
        lastDay = key;
        set(faces.date.querySelector('.md'), mdFmt.format(day));
        set(faces.date.querySelector('.year'), yFmt.format(day));
        set(faces.date.querySelector('.wd'), wdFmt.format(day));
        layout();
      }
    }
  }

  // 같은 칸의 날짜를 초·오전/오후를 뺀 시:분 아래 가운데로 옮김
  function centerDate() {
    if (!faces.date || !faces.digital || where('date') !== where('digital')) return;
    const width = (sel) => {
      const n = faces.digital.querySelector(sel);
      if (n.hidden) return 0;
      const st = getComputedStyle(n);
      return n.getBoundingClientRect().width + parseFloat(st.marginLeft) + parseFloat(st.marginRight);
    };
    const shift = (width('.ampm') - width('.ss')) / 2;
    faces.date.style.transform = `translateX(${shift / parseFloat(getComputedStyle(faces.date).fontSize)}em)`;
  }

  // 시계 안쪽 글자를 원 아래쪽 공간에 맞는 크기로
  function fitInner() {
    if (!inner) return;
    inner.style.fontSize = '';
    const em = parseFloat(getComputedStyle(faces.analog).fontSize);
    const w = inner.offsetWidth / em, h = inner.offsetHeight / em, d = 1.6;
    inner.style.fontSize = `${Math.min((d * 0.46) / w, (d * 0.2) / h)}em`;
  }

  function layout() {
    app.style.fontSize = '100px';
    centerDate();
    fitInner();
    fit(app);
  }

  render();
  autoFit(layout);
  function loop() {
    render();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  }
  setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  onVisible(render);
</script>
</body>
</html>
