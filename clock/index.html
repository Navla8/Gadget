<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
  #app { display: inline-flex; align-items: center; line-height: 1; white-space: nowrap; }
  #app.column { flex-direction: column; }

  .stack { display: flex; flex-direction: column; align-items: center; gap: 0.12em; }
  .stack.start { align-items: flex-start; }
  .stack.end { align-items: flex-end; }

  .digital { display: flex; align-items: baseline; letter-spacing: 0.01em; }
  .colon { color: var(--accent); margin: 0 0.04em; transform: translateY(-0.06em); }
  .blink .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  .digital .small { font-size: 0.32em; color: var(--muted); margin-left: 0.2em; }
  .digital .ampm { margin: 0 0.25em 0 0; }

  /* 디지털과 함께일 때: 한 줄 / 날짜만 있을 때: 두 줄 */
  .date { font-size: 0.27em; color: var(--muted); letter-spacing: 0.03em; }
  .date .md { color: var(--text); }
  .date.solo { font-size: 1em; color: var(--text); text-align: center; letter-spacing: 0; }
  .date.solo .sub { display: block; font-size: 0.34em; color: var(--muted); margin-top: 0.3em; letter-spacing: 0.04em; }
  .date:not(.solo) .year { display: none; }
  .stack.start .date.solo { text-align: left; }
  .stack.end .date.solo { text-align: right; }

  .analog { position: relative; flex: none; }
  .analog svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .analog .stack { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); }
  .tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; }
  .tick.major { stroke: var(--text); stroke-width: 2; }
  .hand { stroke: var(--text); stroke-linecap: round; }
  .hand.second { stroke: var(--accent); stroke-width: 1.2; }
  .pin { fill: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { param, numParam, onVisible, pad } from '../shared/common.js';
  import { fit, autoFit } from '../shared/fit.js';

  // ── 옵션 ─────────────────────────────────────────────
  //   analog / digital / date = 0|1   표시할 요소
  //   pos = left|right|top|bottom|inside   글자(디지털·날짜) 기준 아날로그 위치
  //   datefirst=1   날짜를 디지털 위에
  //   gap=0.3       아날로그와 글자 사이 간격 (em)
  //   hand=0        아날로그 초침 숨김 / seconds=1 디지털 초 표시
  //   hour12=1, blink=0, lang=en, tz=Asia/Seoul
  const on = (k, d) => param(k, d) === '1';
  const legacy = param('style', '');                     // 이전 주소(?style=analog) 호환
  const show = {
    analog: on('analog', legacy === 'analog' ? '1' : '0'),
    digital: on('digital', legacy === 'analog' ? '0' : '1'),
    date: on('date', '0'),
  };
  const pos = param('pos', 'left');
  const dateFirst = on('datefirst', '0');
  const gap = numParam('gap', 0.3);
  const showHand = on('hand', '1');
  const showSeconds = on('seconds', '0');
  const hour12 = on('hour12', '0');
  const blink = on('blink', '1');
  const lang = param('lang', 'ko');
  const tz = param('tz', undefined);

  // ── 시간 ─────────────────────────────────────────────
  const partsFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  function now() {
    const p = Object.fromEntries(partsFmt.formatToParts(new Date()).map((x) => [x.type, x.value]));
    return { h: Number(p.hour), m: Number(p.minute), s: Number(p.second) };
  }
  const locale = lang === 'en' ? 'en-US' : 'ko-KR';
  const dfmt = (o) => new Intl.DateTimeFormat(locale, { timeZone: tz, ...o });
  const mdFmt = dfmt({ month: 'long', day: 'numeric' });
  const yFmt = dfmt({ year: 'numeric' });
  const wdFmt = dfmt({ weekday: 'long' });

  // ── 구조 만들기 ───────────────────────────────────────
  const app = document.getElementById('app');
  const el = (tag, cls, html = '') => Object.assign(document.createElement(tag), { className: cls, innerHTML: html });

  const stack = el('div', `stack ${show.analog ? { left: 'start', right: 'end' }[pos] ?? '' : ''}`);
  const digital = show.digital && el('div', `digital${blink ? ' blink' : ''}`,
    `<span class="small ampm" ${hour12 ? '' : 'hidden'}></span><span class="hh"></span><span class="colon">:</span><span class="mm"></span><span class="small ss" ${showSeconds ? '' : 'hidden'}></span>`);
  const date = show.date && el('div', `date${show.digital ? '' : ' solo'}`,
    `<span class="md"></span> <span class="sub"><span class="year"></span><span class="year"> · </span><span class="wd accent"></span></span>`);
  for (const part of dateFirst ? [date, digital] : [digital, date]) if (part) stack.append(part);
  const hasText = show.digital || show.date;

  let analog = null;
  if (show.analog) {
    analog = el('div', 'analog');
    const ticks = Array.from({ length: 12 }, (_, i) => {
      const major = i % 3 === 0;
      return `<line class="tick${major ? ' major' : ''}" x1="100" y1="${major ? 8 : 10}" x2="100" y2="${major ? 20 : 16}" transform="rotate(${i * 30} 100 100)"/>`;
    }).join('');
    analog.innerHTML = `
      <svg viewBox="0 0 200 200" aria-label="analog clock">
        ${ticks}
        <line data-h class="hand" x1="100" y1="112" x2="100" y2="52" stroke-width="4"/>
        <line data-m class="hand" x1="100" y1="114" x2="100" y2="28" stroke-width="2.4"/>
        ${showHand ? '<line data-s class="hand second" x1="100" y1="120" x2="100" y2="22"/>' : ''}
        <circle class="pin" cx="100" cy="100" r="3"/>
      </svg>`;
  }

  // 배치
  if (analog && hasText && pos === 'inside') {
    analog.append(stack);
    app.append(analog);
  } else {
    const parts = [analog, hasText && stack].filter(Boolean);
    if (pos === 'right' || pos === 'bottom') parts.reverse();
    app.append(...parts);
    if (pos === 'top' || pos === 'bottom') app.classList.add('column');
    app.style.gap = `${gap}em`;
  }

  // 콜론 깜박임을 실제 초에 맞춤
  if (digital) digital.querySelector('.colon').style.animationDelay = `-${Date.now() % 1000}ms`;

  // ── 그리기 ───────────────────────────────────────────
  const set = (node, text) => { if (node && node.textContent !== text) node.textContent = text; };
  let lastDay = '';

  function render() {
    const { h, m, s } = now();
    if (digital) {
      set(digital.querySelector('.ampm'), h < 12 ? (lang === 'en' ? 'AM' : '오전') : (lang === 'en' ? 'PM' : '오후'));
      set(digital.querySelector('.hh'), hour12 ? String(h % 12 || 12) : pad(h));
      set(digital.querySelector('.mm'), pad(m));
      set(digital.querySelector('.ss'), pad(s));
    }
    if (analog) {
      const rot = (sel, deg) => analog.querySelector(sel)?.setAttribute('transform', `rotate(${deg} 100 100)`);
      rot('[data-h]', (h % 12) * 30 + m * 0.5);
      rot('[data-m]', m * 6 + s * 0.1);
      rot('[data-s]', s * 6);
    }
    if (date) {
      const d = new Date();
      const day = mdFmt.format(d) + yFmt.format(d);
      if (day !== lastDay) {
        lastDay = day;
        set(date.querySelector('.md'), mdFmt.format(d));
        set(date.querySelector('.year'), yFmt.format(d));
        set(date.querySelector('.wd'), wdFmt.format(d));
        layout();
      }
    }
  }

  // 아날로그 크기를 글자 덩어리에 맞춘 뒤 전체를 임베드에 꽉 채움
  function layout() {
    app.style.fontSize = '100px';
    if (analog) {
      stack.style.fontSize = '';
      const sw = stack.offsetWidth / 100, sh = stack.offsetHeight / 100;
      let d = 1;
      if (hasText) {
        if (pos === 'inside') {
          d = 4;
          stack.style.fontSize = `${Math.min((d * 0.46) / sw, (d * 0.2) / sh)}em`;
        } else if (pos === 'top' || pos === 'bottom') {
          d = Math.max(sw * 0.8, sh * 2);
        } else {
          d = Math.max(sh * 1.1, 1);
        }
      }
      analog.style.width = analog.style.height = `${d}em`;
    }
    fit(app);
  }

  render();
  autoFit(layout);
  function loop() {
    render();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  }
  setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  onVisible(render);
</script>
</body>
</html>
